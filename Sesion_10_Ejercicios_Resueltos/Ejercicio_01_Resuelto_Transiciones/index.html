<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resuelto 1: Botones y tarjetas con transiciones</title>
  <link rel="stylesheet" href="styles.css">

<style id="btn-atras-css">
.btn-atras{position:fixed;right:16px;bottom:16px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:#111827;color:#fff;font:700 15px Arial,sans-serif;text-decoration:none;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35);border:2px solid #fff;transition:transform .2s ease,background .2s ease}
.btn-atras:hover,.btn-atras:focus-visible{background:#4f46e5;transform:translateX(3px)}
</style>
</head>
<body>
  <button class="boton" type="button">Ver curso</button>
  <section class="galeria" aria-label="Tecnologías de diseño web">
    <article class="tarjeta" tabindex="0"><h2>Flexbox</h2><p>Diseño en una dimensión.</p></article>
    <article class="tarjeta" tabindex="0"><h2>Grid</h2><p>Diseño en dos dimensiones.</p></article>
    <article class="tarjeta" tabindex="0"><h2>Sass</h2><p>Preprocesador CSS.</p></article>
  </section>
<a class="btn-atras" href="../../index.html">&#8592; Atrás</a>
</body>
</html>
